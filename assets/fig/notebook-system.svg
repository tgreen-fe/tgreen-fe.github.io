<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="System diagram. An open notebook with the 7.5-inch e-paper panel set into the inside cover, facing a handwritten page; the driver board, Pico, USB-C controller and cell sit in the back board. Pages pass through capture, compile, render and display stages, and the finished summary returns to the e-paper">
  <g font-family="Helvetica, Arial, sans-serif">

    <!-- ============ the notebook, open ============ -->
    <rect x="36" y="78" width="232" height="160" rx="8" fill="#ececea" stroke="#1b1b19" stroke-width="2.5"/>
    <line x1="152" y1="80" x2="152" y2="236" stroke="#c8c8c1" stroke-width="1.5"/>

    <!-- left leaf: e-paper panel set into the inside cover -->
    <rect x="46" y="90" width="94" height="136" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
    <circle cx="61" cy="103" r="4" fill="none" stroke="#565651" stroke-width="1.5"/>
    <circle cx="76" cy="103" r="4" fill="none" stroke="#565651" stroke-width="1.5"/>
    <circle cx="91" cy="103" r="4" fill="none" stroke="#565651" stroke-width="1.5"/>
    <line x1="52" y1="113" x2="134" y2="113" stroke="#c8c8c1" stroke-width="1.5"/>
    <g stroke="#565651" stroke-width="2.2">
      <line x1="54" y1="128" x2="132" y2="128"/>
      <line x1="54" y1="142" x2="124" y2="142"/>
      <line x1="54" y1="156" x2="130" y2="156"/>
      <line x1="54" y1="170" x2="116" y2="170"/>
      <line x1="54" y1="184" x2="128" y2="184"/>
    </g>

    <!-- right leaf: handwritten page -->
    <g stroke="#565651" stroke-width="1.8">
      <line x1="164" y1="100" x2="254" y2="100"/>
      <line x1="164" y1="116" x2="246" y2="116"/>
      <line x1="164" y1="132" x2="254" y2="132"/>
      <line x1="164" y1="148" x2="240" y2="148"/>
      <line x1="164" y1="164" x2="254" y2="164"/>
      <line x1="164" y1="180" x2="250" y2="180"/>
      <line x1="164" y1="196" x2="254" y2="196"/>
      <line x1="164" y1="212" x2="232" y2="212"/>
    </g>
    <text x="93" y="256" font-size="10" font-weight="700" fill="#1b1b19" text-anchor="middle" letter-spacing="0.5">7.5-INCH E-PAPER</text>
    <text x="209" y="256" font-size="10" fill="#565651" text-anchor="middle" letter-spacing="0.5">HANDWRITTEN PAGE</text>

    <!-- ribbon from the panel down into the back board -->
    <path d="M 138 226 C 148 240, 151 254, 148 268" stroke="#e8590c" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>

    <!-- internals in the back board -->
    <rect x="48" y="268" width="208" height="54" fill="none" stroke="#565651" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g font-size="10" fill="#1b1b19" text-anchor="middle">
      <rect x="54" y="282" width="46" height="26" fill="none" stroke="#565651" stroke-width="1.5"/>
      <text x="77" y="299">DRIVER</text>
      <rect x="106" y="282" width="44" height="26" fill="none" stroke="#565651" stroke-width="1.5"/>
      <text x="128" y="299">PICO</text>
      <rect x="156" y="282" width="44" height="26" fill="none" stroke="#565651" stroke-width="1.5"/>
      <text x="178" y="299">USB-C</text>
      <rect x="206" y="282" width="44" height="26" fill="none" stroke="#565651" stroke-width="1.5"/>
      <text x="228" y="299">CELL</text>
    </g>
    <text x="256" y="340" font-size="10" fill="#565651" letter-spacing="0.5" text-anchor="end">IN THE BACK BOARD</text>

    <!-- ============ forward chain ============ -->
    <path d="M 272 154 H 292" stroke="#565651" stroke-width="2" fill="none"/>
    <path d="M 300 154 l -13 -6.5 v 13 z" fill="#565651"/>
    <text x="284" y="143" font-size="9" fill="#565651" text-anchor="middle">pages</text>

    <g font-size="19" font-weight="700" fill="#1b1b19" text-anchor="middle">
      <rect x="300" y="120" width="120" height="68" fill="none" stroke="#1b1b19" stroke-width="2.5"/>
      <text x="360" y="150">CAPTURE</text>
      <rect x="453" y="120" width="120" height="68" fill="none" stroke="#1b1b19" stroke-width="2.5"/>
      <text x="513" y="150">COMPILE</text>
      <rect x="606" y="120" width="120" height="68" fill="none" stroke="#1b1b19" stroke-width="2.5"/>
      <text x="666" y="150">RENDER</text>
      <rect x="759" y="120" width="120" height="68" fill="none" stroke="#e8590c" stroke-width="2.5"/>
      <text x="819" y="150" fill="#e8590c">DISPLAY</text>
    </g>
    <g font-size="12" fill="#565651" text-anchor="middle">
      <text x="360" y="171">pages to plain text</text>
      <text x="513" y="171">four LLM calls</text>
      <text x="666" y="171">page to 1-bit image</text>
      <text x="819" y="171" fill="#565651">Pico drives the panel</text>
    </g>
    <g font-size="11" fill="#565651" text-anchor="middle">
      <text x="360" y="204">a watched folder</text>
      <text x="360" y="218">triggers the run</text>
      <text x="513" y="204">title &#183; summary</text>
      <text x="513" y="218">spelling &#183; date</text>
      <text x="666" y="204">the browser does</text>
      <text x="666" y="218">the typesetting</text>
      <text x="819" y="204" fill="#565651">zero power</text>
      <text x="819" y="218" fill="#565651">to hold the image</text>
    </g>

    <g stroke="#565651" stroke-width="2" fill="none">
      <path d="M 420 154 H 445"/>
      <path d="M 573 154 H 598"/>
      <path d="M 726 154 H 751"/>
    </g>
    <g fill="#565651">
      <path d="M 453 154 l -13 -6.5 v 13 z"/>
      <path d="M 606 154 l -13 -6.5 v 13 z"/>
      <path d="M 759 154 l -13 -6.5 v 13 z"/>
    </g>

    <!-- ============ the loop back ============ -->
    <path d="M 879 154 H 892 V 362 H 18 V 158 H 22" stroke="#e8590c" stroke-width="2" fill="none"/>
    <path d="M 35 158 l -13 -6.5 v 13 z" fill="#e8590c"/>
    <text x="560" y="354" font-size="12" font-weight="700" fill="#1b1b19" text-anchor="middle" letter-spacing="1">THE SUMMARY COMES BACK TO THE E-PAPER</text>

  </g>
</svg>
