<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" role="img" aria-label="Smart notebook system: two capture tracks feeding text and pen position to the e-paper cover" style="font-family:Aptos, Calibri, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,1.2 L9.4,5 L0.5,8.8 Z" fill="#8c8c8c"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,1.2 L9.4,5 L0.5,8.8 Z" fill="#2f5597"/></marker><filter id="sh" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="1.3" stdDeviation="2.1" flood-color="#1f2328" flood-opacity="0.16"/></filter></defs><rect width="900" height="452" fill="#fcfcfb"/><g filter="url(#sh)"><rect x="20" y="186" width="130" height="80" rx="5" fill="#ededed" stroke="#a5a5a5" stroke-width="1.25"/></g><text x="85.0" y="216.5" text-anchor="middle" font-size="15" fill="#3b3838" dominant-baseline="central">Pen on</text><text x="85.0" y="235.5" text-anchor="middle" font-size="15" fill="#3b3838" dominant-baseline="central">paper</text><text x="190" y="42" text-anchor="start" font-size="13" fill="#2f5597" font-weight="600">Track 1: phone microphone</text><g filter="url(#sh)"><rect x="190" y="54" width="170" height="72" rx="5" fill="#deebf7" stroke="#5b9bd5" stroke-width="1.25"/></g><text x="275.0" y="74.5" text-anchor="middle" font-size="15" fill="#1f4e79" dominant-baseline="central">Phone mic</text><text x="275.0" y="93.5" text-anchor="middle" font-size="15" fill="#1f4e79" dominant-baseline="central">and IMU</text><text x="275.0" y="111.5" text-anchor="middle" font-size="12" fill="#2e75b6" dominant-baseline="central">48 kHz audio</text><g filter="url(#sh)"><rect x="395" y="54" width="170" height="72" rx="5" fill="#b4c7e7" stroke="#4472c4" stroke-width="1.25"/></g><text x="480.0" y="84.0" text-anchor="middle" font-size="15" fill="#1f3864" dominant-baseline="central">CNN + BiGRU</text><text x="480.0" y="102.0" text-anchor="middle" font-size="12" fill="#2f5597" dominant-baseline="central">CTC, lexicon decoder</text><text x="190" y="310" text-anchor="start" font-size="13" fill="#c55a11" font-weight="600">Track 2: piezo array (in progress)</text><g filter="url(#sh)"><rect x="190" y="322" width="170" height="72" rx="5" fill="#deebf7" stroke="#5b9bd5" stroke-width="1.25"/></g><text x="275.0" y="352.0" text-anchor="middle" font-size="15" fill="#1f4e79" dominant-baseline="central">16 piezo discs</text><text x="275.0" y="370.0" text-anchor="middle" font-size="12" fill="#2e75b6" dominant-baseline="central">under the page</text><g filter="url(#sh)"><rect x="395" y="322" width="170" height="72" rx="5" fill="#f8cbad" stroke="#ed7d31" stroke-width="1.25"/></g><text x="480.0" y="342.5" text-anchor="middle" font-size="15" fill="#833c0c" dominant-baseline="central">Amplifier PCB</text><text x="480.0" y="361.5" text-anchor="middle" font-size="15" fill="#833c0c" dominant-baseline="central">and Teensy 4.1</text><text x="480.0" y="379.5" text-anchor="middle" font-size="12" fill="#c55a11" dominant-baseline="central">100 kHz per channel</text><text x="480" y="418" text-anchor="middle" font-size="12" fill="#6b6764" font-weight="400">time difference of arrival gives pen position</text><g filter="url(#sh)"><rect x="605" y="186" width="130" height="80" rx="5" fill="#deebf7" stroke="#5b9bd5" stroke-width="1.25"/></g><text x="670.0" y="216.5" text-anchor="middle" font-size="15" fill="#1f4e79" dominant-baseline="central">Text and</text><text x="670.0" y="235.5" text-anchor="middle" font-size="15" fill="#1f4e79" dominant-baseline="central">position</text><g filter="url(#sh)"><rect x="770" y="186" width="110" height="80" rx="5" fill="#c5e0b4" stroke="#70ad47" stroke-width="1.25"/></g><text x="825.0" y="210.5" text-anchor="middle" font-size="15" fill="#375623" dominant-baseline="central">E-paper</text><text x="825.0" y="229.5" text-anchor="middle" font-size="15" fill="#375623" dominant-baseline="central">cover</text><text x="825.0" y="247.5" text-anchor="middle" font-size="12" fill="#548235" dominant-baseline="central">Pico W</text><path d="M150,214 L168,214 L168,90 L184,90" stroke="#8c8c8c" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M150,240 L168,240 L168,358 L184,358" stroke="#8c8c8c" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M360,90 L389,90" stroke="#8c8c8c" stroke-width="1.6" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><path d="M360,358 L389,358" stroke="#8c8c8c" stroke-width="1.6" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><path d="M565,90 L662,90 Q670,90 670,98 L670,180" stroke="#8c8c8c" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><path d="M565,358 L662,358 Q670,358 670,350 L670,272" stroke="#8c8c8c" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><path d="M735,226 L764,226" stroke="#8c8c8c" stroke-width="1.6" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><text x="752" y="154" text-anchor="middle" font-size="12" fill="#6b6764" font-weight="400">LLM summary,</text><text x="752" y="170" text-anchor="middle" font-size="12" fill="#6b6764" font-weight="400">1-bit render</text></svg>