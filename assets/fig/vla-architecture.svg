<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="Four tactile injection routes into a vision-language-action model" style="font-family:Aptos, Calibri, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,1.2 L9.4,5 L0.5,8.8 Z" fill="#8c8c8c"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,1.2 L9.4,5 L0.5,8.8 Z" fill="#c55a11"/></marker><filter id="sh" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="1.3" stdDeviation="2.1" flood-color="#1f2328" flood-opacity="0.16"/></filter></defs><rect width="900" height="410" fill="#fcfcfb"/>
<!-- inputs -->
<g filter="url(#sh)"><rect x="30" y="36" width="170" height="44" rx="5" fill="#deebf7" stroke="#5b9bd5" stroke-width="1.25"/></g><text x="115" y="58" text-anchor="middle" font-size="14" fill="#1f4e79" dominant-baseline="central">RGB observation</text>
<g filter="url(#sh)"><rect x="30" y="96" width="170" height="44" rx="5" fill="#deebf7" stroke="#5b9bd5" stroke-width="1.25"/></g><text x="115" y="118" text-anchor="middle" font-size="14" fill="#1f4e79" dominant-baseline="central">Task instruction</text>
<g filter="url(#sh)"><rect x="30" y="156" width="170" height="44" rx="5" fill="#deebf7" stroke="#5b9bd5" stroke-width="1.25"/></g><text x="115" y="178" text-anchor="middle" font-size="14" fill="#1f4e79" dominant-baseline="central">Robot state</text>
<g filter="url(#sh)"><rect x="30" y="254" width="170" height="56" rx="5" fill="#f8cbad" stroke="#ed7d31" stroke-width="1.25"/></g><text x="115" y="275" text-anchor="middle" font-size="14" fill="#833c0c" dominant-baseline="central">Optical tactile sensor</text><text x="115" y="293" text-anchor="middle" font-size="11.5" fill="#c55a11" dominant-baseline="central">gel imprint of the material held</text>
<!-- routes -->
<text x="365" y="216" text-anchor="middle" font-size="12.5" fill="#c55a11" font-weight="600">Four injection routes, the variable under test</text>
<g filter="url(#sh)"><rect x="245" y="228" width="240" height="32" rx="5" fill="#f8cbad" stroke="#ed7d31" stroke-width="1.25"/></g><text x="365" y="244" text-anchor="middle" font-size="12.5" fill="#833c0c" dominant-baseline="central">1 · Camera slot: the gel image</text>
<g filter="url(#sh)"><rect x="245" y="268" width="240" height="32" rx="5" fill="#f8cbad" stroke="#ed7d31" stroke-width="1.25"/></g><text x="365" y="284" text-anchor="middle" font-size="12.5" fill="#833c0c" dominant-baseline="central">2 · State vector: class probabilities</text>
<g filter="url(#sh)"><rect x="245" y="308" width="240" height="32" rx="5" fill="#f8cbad" stroke="#ed7d31" stroke-width="1.25"/></g><text x="365" y="324" text-anchor="middle" font-size="12.5" fill="#833c0c" dominant-baseline="central">3 · Token: classifier embedding</text>
<g filter="url(#sh)"><rect x="245" y="348" width="240" height="32" rx="5" fill="#f8cbad" stroke="#ed7d31" stroke-width="1.25"/></g><text x="365" y="364" text-anchor="middle" font-size="12.5" fill="#833c0c" dominant-baseline="central">4 · Prompt: material named in text</text>
<!-- backbone -->
<g filter="url(#sh)"><rect x="510" y="36" width="180" height="344" rx="5" fill="#b4c7e7" stroke="#4472c4" stroke-width="1.25"/></g>
<text x="600" y="110" text-anchor="middle" font-size="15" fill="#1f3864" dominant-baseline="central" font-weight="600">SmolVLA</text>
<text x="600" y="132" text-anchor="middle" font-size="12" fill="#2f5597" dominant-baseline="central">SigLIP vision encoder</text>
<text x="600" y="148" text-anchor="middle" font-size="12" fill="#2f5597" dominant-baseline="central">SmolLM2 language model</text>
<text x="600" y="164" text-anchor="middle" font-size="12" fill="#2f5597" dominant-baseline="central">flow-matching action expert</text>
<text x="600" y="184" text-anchor="middle" font-size="11" fill="#2f5597" dominant-baseline="central">fine-tuned on</text>
<text x="600" y="198" text-anchor="middle" font-size="11" fill="#2f5597" dominant-baseline="central">YuMi demonstrations</text>
<g filter="url(#sh)"><rect x="524" y="300" width="152" height="60" rx="5" fill="#fbe5d6" stroke="#ed7d31" stroke-width="1.25" stroke-dasharray="4 3"/></g>
<text x="600" y="318" text-anchor="middle" font-size="12.5" fill="#833c0c" dominant-baseline="central">Auxiliary tactile head</text>
<text x="600" y="334" text-anchor="middle" font-size="11" fill="#c55a11" dominant-baseline="central">predicts the material,</text>
<text x="600" y="348" text-anchor="middle" font-size="11" fill="#c55a11" dominant-baseline="central">training only, λ = 0.1</text>
<!-- output -->
<g filter="url(#sh)"><rect x="730" y="160" width="150" height="82" rx="5" fill="#c5e0b4" stroke="#70ad47" stroke-width="1.25"/></g>
<text x="805" y="184" text-anchor="middle" font-size="14" fill="#375623" dominant-baseline="central">Action chunk</text>
<text x="805" y="203" text-anchor="middle" font-size="12" fill="#548235" dominant-baseline="central">50 end-effector deltas</text>
<text x="805" y="221" text-anchor="middle" font-size="11" fill="#548235" dominant-baseline="central">ABB YuMi IRB 14000</text>
