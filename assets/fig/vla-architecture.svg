<path d="M485,284 L506,284" stroke="#c55a11" stroke-width="1.5" fill="none" marker-end="url(#aho)" stroke-linecap="round"/>
<path d="M485,324 L506,324" stroke="#c55a11" stroke-width="1.5" fill="none" marker-end="url(#aho)" stroke-linecap="round"/>
<path d="M485,364 L506,364" stroke="#c55a11" stroke-width="1.5" fill="none" marker-end="url(#aho)" stroke-linecap="round"/>
<!-- backbone to output -->
<path d="M690,201 L726,201" stroke="#8c8c8c" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-linecap="round"/>
<text x="30" y="400" text-anchor="start" font-size="12.5" fill="#6b6764">Backbone, task, data and recipe held constant; one route is active per policy. The head is added in the final experiment.</text>
