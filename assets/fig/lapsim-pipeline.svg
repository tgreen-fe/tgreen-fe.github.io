<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 536" role="img" aria-label="Lap simulation pipeline" style="font-family:Aptos, Calibri, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,1.2 L9.4,5 L0.5,8.8 Z" fill="#8c8c8c"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,1.2 L9.4,5 L0.5,8.8 Z" fill="#2f5597"/></marker><filter id="sh" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="1.3" stdDeviation="2.1" flood-color="#1f2328" flood-opacity="0.16"/></filter></defs><rect width="360" height="536" fill="#fcfcfb"/><g filter="url(#sh)"><rect x="30" y="14" width="300" height="72" rx="5" fill="#deebf7" stroke="#5b9bd5" stroke-width="1.25"/></g><text x="180.0" y="34.5" text-anchor="middle" font-size="15" fill="#1f4e79" dominant-baseline="central">Proposed circuit</text><text x="180.0" y="53.5" text-anchor="middle" font-size="15" fill="#1f4e79" dominant-baseline="central">geometry</text><text x="180.0" y="71.5" text-anchor="middle" font-size="12" fill="#2e75b6" dominant-baseline="central">centreline and width</text><path d="M180,91 L180,108" stroke="#8c8c8c" stroke-width="1.8" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><g filter="url(#sh)"><rect x="30" y="112" width="300" height="72" rx="5" fill="#deebf7" stroke="#5b9bd5" stroke-width="1.25"/></g><text x="180.0" y="142.0" text-anchor="middle" font-size="15" fill="#1f4e79" dominant-baseline="central">Track model</text><text x="180.0" y="160.0" text-anchor="middle" font-size="12" fill="#2e75b6" dominant-baseline="central">curvature, elevation, surface</text><path d="M180,189 L180,206" stroke="#8c8c8c" stroke-width="1.8" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><g filter="url(#sh)"><rect x="30" y="210" width="300" height="72" rx="5" fill